[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
ffi = false
fs_permissions = [{ access = "read", path = "../" }, { access = "read", path = "./" }]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@gluwa/usc-contracts/=../node_modules/@gluwa/usc-contracts/"
]