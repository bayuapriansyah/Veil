[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=../node_modules/@openzeppelin/",
  "@gluwa/usc-contracts/=../node_modules/@gluwa/usc-contracts/"
]